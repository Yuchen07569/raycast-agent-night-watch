name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  raycast-extension:
    runs-on: macos-14
    defaults:
      run:
        working-directory: raycast-extension
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: raycast-extension/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Audit high-severity dependencies
        run: npm audit --audit-level=high

  windows-portable:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configure x64 Release build
        run: cmake -S windows-tray -B out/windows-x64 -A x64 -DBUILD_TESTING=ON
      - name: Build with MSVC static analysis
        run: cmake --build out/windows-x64 --config Release --parallel
      - name: Test power transaction core
        run: ctest --test-dir out/windows-x64 -C Release --output-on-failure
      - name: Scan executable with Microsoft Defender
        run: |
          $scanner = Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" |
            Sort-Object FullName |
            Select-Object -Last 1
          if (-not $scanner) { throw "Microsoft Defender CLI was not found" }
          $executable = (Resolve-Path "out/windows-x64/Release/AgentNightWatch.exe").Path
          & $scanner.FullName -Scan -ScanType 3 -File $executable
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Defender scan failed with exit code $LASTEXITCODE" }
      - name: Package portable Beta and SPDX SBOM
        run: ./.github/scripts/package_windows_beta.ps1 -BuildDirectory out/windows-x64/Release -OutputDirectory out/release
      - name: Upload unsigned invitation-only artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-night-watch-windows-x64-unsigned-beta
          path: |
            out/release/AgentNightWatch-0.2.0-beta.1-windows-x64.zip
            out/release/AgentNightWatch-0.2.0-beta.1-windows-x64.zip.sha256
            out/release/AgentNightWatch-0.2.0-beta.1.spdx.json
          if-no-files-found: error
          retention-days: 14

  skill-and-shell:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check shell scripts
        run: shellcheck .agents/skills/agent-night-watch/scripts/preflight.sh
      - name: Check PowerShell preflight syntax
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .agents/skills/agent-night-watch/scripts/preflight.ps1),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Validate Skill package
        run: python3 .github/scripts/validate_skill.py .agents/skills/agent-night-watch
      - name: Scan tracked files for common secrets
        run: python3 .github/scripts/check_for_secrets.py
